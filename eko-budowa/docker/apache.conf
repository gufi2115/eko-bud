ServerName localhost
ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    DirectoryIndex index.php

    Alias /admin   /var/www/html/admin
    Alias /uploads /var/www/html/uploads

    <Directory /var/www/html/public>
        Options -Indexes -MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/html/admin>
        Options -Indexes
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>

    # Uploads: brak wykonywania skryptów, tylko obrazy
    <Directory /var/www/html/uploads>
        Options -Indexes -ExecCGI
        AllowOverride None
        Require all granted
        RemoveHandler .php .phtml .php3 .php5 .phar
        php_admin_flag engine off
        <FilesMatch "(?i)\.(?!(jpe?g|png|webp)$)[^.]+$">
            Require all denied
        </FilesMatch>
        Header set X-Content-Type-Options "nosniff"
        Header set Cache-Control "public, max-age=2592000, immutable"
    </Directory>

    # Dane i kod źródłowy nigdy nie są dostępne przez HTTP
    <DirectoryMatch "^/var/www/html/(data|src|docker)">
        Require all denied
    </DirectoryMatch>
    <FilesMatch "(?i)(\.sqlite|\.env|\.ini|\.sh|\.md|Dockerfile|Caddyfile|\.ya?ml)$">
        Require all denied
    </FilesMatch>

    # Nagłówki bezpieczeństwa
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-src https://www.google.com https://maps.google.com; form-action 'self'; base-uri 'self'; frame-ancestors 'self'"

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
